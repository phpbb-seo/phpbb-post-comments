<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Secondary Accent Bubble Gradient -->
    <linearGradient id="nestedBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Card/Surface Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>

    <filter id="subShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.38"/>
    </filter>

    <filter id="avatarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Highlight Border -->
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="130" cy="110" r="140" fill="rgba(255,255,255,0.09)"/>

  <!-- ================= Parent Post Card / Bubble ================= -->
  <g filter="url(#cardShadow)">
    <!-- Main Bubble -->
    <path d="M 88 120 
             C 88 98, 106 80, 128 80 
             L 376 80 
             C 398 80, 416 98, 416 120 
             L 416 230 
             C 416 252, 398 270, 376 270 
             L 156 270 
             L 108 306 
             L 116 270 
             C 100 270, 88 256, 88 238 
             Z" 
          fill="url(#cardGrad)"/>

    <!-- Avatar Circle -->
    <circle cx="140" cy="142" r="24" fill="#e0e7ff"/>
    <!-- Avatar User Silhouette -->
    <circle cx="140" cy="136" r="9" fill="#6366f1"/>
    <path d="M 124 158 C 124 149, 131 146, 140 146 C 149 146, 156 149, 156 158 Z" fill="#6366f1"/>

    <!-- User Name Line -->
    <rect x="178" y="128" width="90" height="11" rx="5.5" fill="#475569"/>
    <!-- Post Timestamp Line -->
    <rect x="178" y="146" width="55" height="7" rx="3.5" fill="#94a3b8"/>

    <!-- Post Text Content Lines -->
    <rect x="124" y="184" width="252" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="124" y="206" width="220" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="124" y="228" width="140" height="10" rx="5" fill="#e2e8f0"/>
  </g>

  <!-- ================= Nested Connector Thread Line ================= -->
  <!-- Mimics the 3px signature vB6 / phpBB SEO left indicator line -->
  <path d="M 148 290 
           L 148 375 
           Q 148 400 174 400 
           L 186 400" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round"
        stroke-dasharray="1 0"
        opacity="0.85"/>

  <!-- ================= Child Nested Comment Bubble ================= -->
  <g filter="url(#subShadow)">
    <!-- Nested Comment Card -->
    <path d="M 186 315 
             C 186 298, 200 284, 218 284 
             L 414 284 
             C 432 284, 446 298, 446 315 
             L 446 415 
             C 446 432, 432 446, 414 446 
             L 242 446 
             L 204 472 
             L 210 446 
             C 196 446, 186 434, 186 420 
             Z" 
          fill="url(#nestedBubbleGrad)"/>

    <!-- Nested Comment Mini Avatar -->
    <circle cx="226" cy="332" r="18" fill="#ffffff" filter="url(#avatarShadow)"/>
    <circle cx="226" cy="328" r="6.8" fill="#0284c7"/>
    <path d="M 214 345 C 214 338, 219 336, 226 336 C 233 336, 238 338, 238 345 Z" fill="#0284c7"/>

    <!-- Comment User Line -->
    <rect x="256" y="322" width="70" height="9" rx="4.5" fill="#ffffff"/>
    <rect x="256" y="336" width="40" height="6" rx="3" fill="#bae6fd"/>

    <!-- Comment Text Lines -->
    <rect x="216" y="366" width="198" height="8" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="216" y="384" width="168" height="8" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="216" y="402" width="110" height="8" rx="4" fill="#bae6fd" opacity="0.9"/>
    
    <!-- Subtle Send / Quick Comment Badge Icon in Bottom Right -->
    <g transform="translate(398, 412) scale(0.9)">
      <circle cx="16" cy="16" r="16" fill="#ffffff" filter="url(#avatarShadow)"/>
      <path d="M 10 22 L 23 16 L 10 10 L 12 15 L 18 16 L 12 17 Z" fill="#0284c7"/>
    </g>
  </g>
</svg>
